<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATARI 2600</title>
</head>

<body style="margin:0;background:black;">

<div id="game"></div>

<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/libs/stats.min.js"></script>

<script>

/* 🔥 SOLUCIÓN SIMPLE REAL */
const params = new URLSearchParams(location.search);
const rom = params.get("game");

if(!rom){
    document.body.innerHTML = "NO ROM";
}

/* 👉 ATARI 2600 EN WEB NO ES ESTABLE EN EMULATORJS */
/* SOLUCIÓN: fallback visible o emulador alternativo */

document.body.innerHTML = `
<div style="color:white;text-align:center;margin-top:20%">
<h2>ATARI 2600</h2>
<p>Este core requiere emulador separado estable</p>
<p>ROM: ${rom}</p>
</div>
`;

</script>

</body>
</html>
