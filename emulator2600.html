<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atari 2600</title>
<style>
html,body{
margin:0;
padding:0;
background:black;
height:100%;
overflow:hidden;
}
iframe{
width:100%;
height:100%;
border:0;
}
</style>
</head>

<body>

<iframe id="emu"></iframe>

<script>

const params = new URLSearchParams(location.search);
const rom = params.get("game");

/* 🔥 EMULADOR REAL EXTERNO ESTABLE */
if(!rom){
    document.body.innerHTML = "NO ROM";
}

/* 👉 Stella Web (RetroArch Web Core host confiable) */
const url =
`https://binbashbanana.github.io/webretro/?core=stella2014&rom=${encodeURIComponent(location.origin + "/" + rom)}`;

document.getElementById("emu").src = url;

</script>

</body>
</html>
