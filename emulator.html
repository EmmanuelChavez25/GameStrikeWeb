<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Strike Engine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #emulator-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="emulator-container"></div>

    <script>
        // 1. Capturar los parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        const coreParam = params.get('core') || 'sega32x';

        // 2. Mapear los núcleos estables del CDN oficial
        let coreId = 'picodrive'; // Por defecto Sega 32X
        if (coreParam === 'arcade') {
            coreId = 'mame2003_plus';
        }

        if (romUrl) {
            // 3. Configuración obligatoria de EmulatorJS
            window.EJS_player = '#emulator-container';
            window.EJS_core = coreId;
            window.EJS_gameUrl = decodeURIComponent(romUrl); // Descodifica espacios y caracteres como ~
            window.EJS_startOnLoaded = true;
            
            // Directorio de datos unificado
            window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/linuxserver/emulatorjs@latest/frontend/data/';

            // 4. Inyectar el script cargador oficial
            const scriptLoader = document.createElement('script');
            scriptLoader.src = 'https://cdn.jsdelivr.net/gh/linuxserver/emulatorjs@latest/frontend/data/loader.js';
            document.body.appendChild(scriptLoader);
        } else {
            document.body.innerHTML = "<div style='color:white; text-align:center; padding-top:20px;'>Falta especificar la ROM del juego.</div>";
        }
    </script>
</body>
</html>
