<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emulator</title>

<style>
html,body,#game{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}
</style>
</head>

<body>

<div id="game"></div>

<script>

/* =========================
   LOAD PARAMS
========================= */

const params = new URLSearchParams(window.location.search);

const romUrl = params.get('game') || params.get('rom');
let coreParam = (params.get('core') || '').toLowerCase();

/* =========================
   AUTO DETECT FIX (PRO MODE)
========================= */

function detectCore() {

    /* si viene vacío → sega por defecto */
    if(!coreParam) return "picodrive";

    /* normalizamos errores típicos */
    coreParam = coreParam.replace(/\s/g,'');

    if(coreParam.includes("sega") || coreParam === "sega32x") return "picodrive";

    if(coreParam.includes("arcade") || coreParam.includes("mame")) return "mame2003_plus";

    if(coreParam.includes("7800")) return "prosystem";

    /* 🔥 ATARI 2600 FIX REAL */
    if(coreParam.includes("2600") || coreParam.includes("atari2600")) return "stella2014";

    /* fallback seguro */
    return "picodrive";
}

let coreId = detectCore();

/* =========================
   VALIDATION FIX
========================= */

if(!romUrl){
    document.body.innerHTML = "ERROR: NO ROM";
    throw new Error("No ROM");
}

/* =========================
   EMULATORJS INIT
========================= */

window.EJS_player = "#game";
window.EJS_core = coreId;
window.EJS_gameUrl = romUrl;
window.EJS_startOnLoaded = true;
window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

/* =========================
   LOAD EMULATOR
========================= */

function loadEmulator(){
    const s = document.createElement("script");
    s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    s.onload = () => waitCanvas();
    document.body.appendChild(s);
}

/* =========================
   CANVAS FIX (IMPORTANTE)
========================= */

function waitCanvas(){
    const canvas = document.querySelector("canvas");

    if(canvas){
        canvas.tabIndex = 0;
        canvas.focus();

        /* FIX INPUT MOBILE */
        canvas.style.outline = "none";

        return;
    }

    setTimeout(waitCanvas, 300);
}

/* START */
loadEmulator();

</script>

</body>
</html>
