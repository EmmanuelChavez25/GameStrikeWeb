<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Strike Player</title>
    <style>
        html, body, #game {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        const coreParam = params.get('core') || 'sega32x';

        let coreId = 'picodrive'; 
        if (coreParam === 'arcade') {
            coreId = 'mame2003_plus';
        }

        if (romUrl) {
            window.EJS_player = '#game';
            window.EJS_core = coreId;
            window.EJS_gameUrl = decodeURIComponent(romUrl); 
            window.EJS_startOnLoaded = true;
            
            // CDN oficial ultra-estable de producción
            window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@latest/data/';

            const loader = document.createElement('script');
            loader.src = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@latest/data/loader.js';
            document.body.appendChild(loader);
        } else {
            document.body.innerHTML = "<div style='color:white;text-align:center;padding-top:50px;'>Falta especificar la ROM.</div>";
        }
    </script>
</body>
</html>
