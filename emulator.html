<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8"/>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>GameStrike Player</title>

    <style>

        html,
        body,
        #game{

            margin:0;
            padding:0;
            width:100%;
            height:100%;
            background:black;
            overflow:hidden;
        }

    </style>

</head>

<body>

<div id="game"></div>

<script>

const params = new URLSearchParams(window.location.search);

const romUrl = params.get('rom');

const coreParam = params.get('core') || 'sega32x';

let coreId = 'picodrive';

if(coreParam === 'arcade'){
    coreId = 'mame2003_plus';
}

if(romUrl){

    window.EJS_player = '#game';

    window.EJS_core = coreId;

    window.EJS_gameUrl = romUrl;

    window.EJS_startOnLoaded = true;

    window.EJS_pathtodata =
        'https://cdn.emulatorjs.org/stable/data/';

    const loader = document.createElement('script');

    loader.src =
        'https://cdn.emulatorjs.org/stable/data/loader.js';

    document.body.appendChild(loader);

}else{

    document.body.innerHTML = `
        <div style="
            color:white;
            text-align:center;
            padding-top:50px;
            font-family:Arial;
        ">
            No se encontró ROM.
        </div>
    `;
}

</script>

</body>
</html>
