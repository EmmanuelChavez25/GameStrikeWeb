<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game-Strike Retro Engine</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #emulator { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="emulator"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        let core = params.get('core') || 'wonderswan';

        if (romUrl) {
            // Mapeo de compatibilidad estricta para el CDN de producción
            if (core === 'wonderswan') core = 'mednafen_wswan'; // Nombre real y estable del core de Wonderswan
            if (core === 'arcade') core = 'mame2003_plus';      // Nombre real y estable para WWF Arcade

            window.EJS_player = '#emulator';
            window.EJS_core = core;
            window.EJS_gameUrl = romUrl;
            
            // Apuntamos al CDN oficial de producción que contiene los archivos compilados estables (.data y .wasm)
            window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/linuxserver/emulatorjs@latest/frontend/data/';
            window.EJS_startOnLoaded = true;

            // Inyectamos el cargador oficial desde la misma infraestructura estable
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/linuxserver/emulatorjs@latest/frontend/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
