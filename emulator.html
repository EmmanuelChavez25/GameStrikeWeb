<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EmulatorJS Core</title>

<style>
html,body,#game{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}
</style>
</head>

<body>

<div id="game"></div>

<script>

const params = new URLSearchParams(location.search);

const romUrl = params.get('game');
const coreParam = (params.get('core') || '').toLowerCase();

/* =========================
   CORE SEGURO
========================= */

let coreId = "picodrive"; // default sega

/* =========================
   SEGA
========================= */
if(coreParam.includes("sega")) coreId = "picodrive";

/* =========================
   ARCADE
========================= */
if(coreParam.includes("arcade")) coreId = "mame2003_plus";

/* =========================
   ATARI 7800
========================= */
if(coreParam.includes("7800")) coreId = "prosystem";

/* =========================
   ATARI 2600
========================= */
if(coreParam.includes("2600")) coreId = "stella2014";

/* =========================
   JAGUAR
========================= */
if(coreParam.includes("jaguar")) coreId = "virtualjaguar";

/* =========================
   NES
========================= */
if(coreParam.includes("nes")) coreId = "fceumm";

/* =========================
   NINTENDO 64 (AGREGADO)
========================= */
if(coreParam.includes("n64")) coreId = "parallel_n64";

/* =========================
   fallback seguro
========================= */
if(!coreParam) coreId = "picodrive";

if(!romUrl){
    document.body.innerHTML = "NO ROM";
    throw new Error("NO ROM");
}

/* =========================
   EMULATORJS INIT
========================= */

window.EJS_player = "#game";
window.EJS_core = coreId;
window.EJS_gameUrl = romUrl;
window.EJS_startOnLoaded = true;

/* MÁS ESTABLE PARA N64 */
window.EJS_threads = false;

/* DATA */
window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

/* AUTO SAVE */
window.EJS_color = "#4f46e5";

/* CARGAR */
const s = document.createElement("script");
s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
document.body.appendChild(s);

</script>

</body>
</html>
