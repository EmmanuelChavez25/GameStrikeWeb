<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Strike Player</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        iframe { display: block; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe id="player-frame" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const embedUrl = params.get('embed');
        
        if (embedUrl) {
            // Cargamos directamente la consola pre-armada de Internet Archive
            document.getElementById('player-frame').src = decodeURIComponent(embedUrl) + "?autoplay=1";
        } else {
            document.body.innerHTML = "<div style='color:white;text-align:center;padding-top:50px;'>Seleccioná un juego del catálogo.</div>";
        }
    </script>

</body>
</html>
