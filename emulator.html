<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game-Strike Retro Engine</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <iframe id="retro-player"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        let core = params.get('core') || 'wonderswan';

        // Corrección de nombres de cores para el servidor espejo comercial
        if (core === 'arcade') core = 'mame';

        if (romUrl) {
            const player = document.getElementById('retro-player');
            // Usamos la pasarela espejo de emulación unificada de un solo archivo.
            // Al pasarle los parámetros limpios, levanta el núcleo directo en tu pantalla sin buscar librerías externas sueltas.
            player.src = `https://www.retrogames.cc/embed/retroarch.html?core=${core}&rom=${encodeURIComponent(romUrl)}`;
        }
    </script>
</body>
</html>
