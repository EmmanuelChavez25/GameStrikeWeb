<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Game-Strike Retro Engine</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #emulator { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="emulator"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        const core = params.get('core') || 'wonderswan';

        if (romUrl) {
            // Configuración nativa directa
            window.EJS_player = '#emulator';
            window.EJS_core = core;
            window.EJS_gameUrl = romUrl;
            
            // Usamos el servidor de datos e imágenes estático de la red global unificada
            window.EJS_pathtodata = 'https://raw.githack.com/emulatorjs/emulatorjs/main/data/';
            window.EJS_startOnLoaded = true;

            // Inyectamos el cargador principal desde una ruta espejo estática que no se rompe ni busca sub-scripts
            const script = document.createElement('script');
            script.src = 'https://raw.githack.com/emulatorjs/emulatorjs/main/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
