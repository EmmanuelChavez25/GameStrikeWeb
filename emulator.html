<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Core Engine Premium</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <iframe id="engine-frame"></iframe>

    <script>
        // Capturamos las variables que manda el index.html
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        let core = params.get('core') || 'wonderswan';

        // Corrección estricta por si el core viene mapeado diferente
        if (core === 'arcade') core = 'mame';

        if (romUrl) {
            const frame = document.getElementById('engine-frame');
            // Inyectamos el cargador plano de emulación estática de heroku/webretro 
            // que procesa el .zip de Archive directamente en caliente sin buscar sub-scripts
            frame.src = `https://webretro.github.io/webretro/?core=${core}&rom=${encodeURIComponent(romUrl)}`;
        }
    </script>
</body>
</html>
