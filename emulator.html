<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emulator</title>

<style>
html,body,#game{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}
</style>
</head>

<body>

<div id="game"></div>

<script>

/* =========================
   LOAD PARAMS
========================= */

const params = new URLSearchParams(window.location.search);

const romUrl = params.get('game') || params.get('rom');
const coreParam = params.get('core') || 'sega32x';

/* =========================
   CORE MAP (FIX REAL)
========================= */

let coreId = 'picodrive';

/* SEGA 32X */
if(coreParam === 'sega32x'){
    coreId = 'picodrive';
}

/* ARCADE */
if(coreParam === 'arcade'){
    coreId = 'mame2003_plus';
}

/* ATARI 7800 */
if(coreParam === 'atari7800'){
    coreId = 'prosystem';
}

/* 🔥 ATARI 2600 FIX */
if(coreParam === 'atari2600'){
    coreId = 'stella2014';
}

/* fallback seguro */
if(!coreParam){
    coreId = 'picodrive';
}

/* =========================
   VALIDATION FIX
========================= */

if(!romUrl){
    document.body.innerHTML = "ERROR: NO ROM";
    throw new Error("No ROM");
}

/* =========================
   EMULATORJS INIT
========================= */

window.EJS_player = "#game";
window.EJS_core = coreId;
window.EJS_gameUrl = romUrl;
window.EJS_startOnLoaded = true;
window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

/* =========================
   LOAD SCRIPT PROPERLY
========================= */

function loadEmulator(){
    const s = document.createElement("script");
    s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    s.onload = () => waitCanvas();
    document.body.appendChild(s);
}

/* =========================
   WAIT CANVAS FIX
========================= */

function waitCanvas(){
    const canvas = document.querySelector("canvas");

    if(canvas){
        canvas.tabIndex = 0;
        canvas.focus();
        return;
    }

    setTimeout(waitCanvas, 500);
}

/* START */
loadEmulator();

</script>

</body>
</html>
