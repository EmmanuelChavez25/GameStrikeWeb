<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Core Engine Premium</title>
    <style>
        html, body, #game { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    </style>
</head>
<body>

    <div id="game"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const romUrl = params.get('rom');
        let core = params.get('core') || 'wonderswan';

        if (core === 'wonderswan') core = 'mednafen_wswan';
        if (core === 'arcade') core = 'mame2003_plus';
        if (core === 'sega32x') core = 'picodrive'; 

        if (romUrl && core) {
            window.EJS_player = '#game';
            window.EJS_core = core;
            window.EJS_gameUrl = romUrl;
            
            // CONFIGURACIÓN DE SEGURIDAD PARA EVITAR LOS 404 DE IMÁGENES:
            window.EJS_backgroundImg = ''; // Desactivamos la imagen de carga de fondo
            window.EJS_startOnLoaded = true;
            
            // Apuntamos al CDN estable unificado de LinuxServer
            window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/linuxserver/emulatorjs@latest/frontend/data/';

            const loader = document.createElement('script');
            loader.src = 'https://cdn.jsdelivr.net/gh/linuxserver/emulatorjs@latest/frontend/data/loader.js';
            document.body.appendChild(loader);
        }
    </script>
</body>
</html>
