<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>GAME-STRIKE RETRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

html{ scroll-behavior:smooth; }

body{
    background:#070b14;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 25%),
    radial-gradient(circle at bottom right,#581c87 0%,transparent 25%);
    opacity:.25;
    z-index:-1;
}

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-track{ background:#0b0f19; }
::-webkit-scrollbar-thumb{ background:#312e81; border-radius:10px; }

.game-card{ transition:.25s; }
.game-card:hover{
    transform:translateY(-5px) scale(1.02);
    border-color:#6366f1;
    box-shadow:0 0 20px rgba(99,102,241,.25);
}

.fullscreen-mode{ overflow:hidden; }

.emulator-container{ height:75vh; }

#loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:99999;
}

.loader{
    width:80px;
    height:80px;
    border:6px solid #312e81;
    border-top:6px solid #8b5cf6;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:25px;
}

@keyframes spin{ to{ transform:rotate(360deg);} }

/* WELCOME SCREEN */
#welcome{
    position:fixed;
    inset:0;
    background:black;
    z-index:100000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#welcome h1{
    font-size:34px;
    font-weight:900;
    background:linear-gradient(90deg,#6366f1,#a855f7);
    -webkit-background-clip:text;
    color:transparent;
}

#welcome p{
    color:#aaa;
    margin-top:10px;
}

#welcome button{
    margin-top:20px;
    padding:10px 20px;
    border-radius:12px;
    background:#6366f1;
    font-weight:bold;
}

.adbox{ margin-top:15px; }

</style>
</head>

<body class="text-white font-sans min-h-screen flex flex-col">

<!-- WELCOME -->
<div id="welcome">

    <h1>BIENVENIDOS A GAME STRIKE</h1>
    <p>Retro Gaming Online - EmulatorJS Edition</p>

    <div class="adbox">
        <script async="async" data-cfasync="false"
        src="https://pl29470229.effectivecpmnetwork.com/e61a275bae57ec5c68e79426fe108696/invoke.js"></script>
        <div id="container-e61a275bae57ec5c68e79426fe108696"></div>
    </div>

    <div class="adbox">
        <script async="async" data-cfasync="false"
        src="https://pl29470228.effectivecpmnetwork.com/a9/69/ee/a969eee3f6606fdd30bb1074b6e8e53f.js"></script>
    </div>

    <button onclick="enterSite()">ENTRAR</button>
</div>

<!-- LOADING -->
<div id="loading-overlay">
<div class="loader"></div>
<div class="loading-text">CARGANDO JUEGO...</div>
<div class="loading-sub">Preparando emulador retro</div>
</div>

<!-- HEADER -->
<header class="sticky top-0 z-50 backdrop-blur-lg bg-black/60 border-b border-indigo-900">

<div class="max-w-7xl mx-auto px-4">

<div class="h-16 flex items-center justify-between">

<div>

<h1 class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">
GAME-STRIKE RETRO
</h1>

<p class="text-xs text-gray-400">Retro Gaming Online</p>

<div class="flex gap-2 mt-2 flex-wrap">

<button onclick="filtrar('ALL')" class="px-3 py-1 text-xs rounded-xl bg-gray-800 border border-gray-600">ALL</button>
<button onclick="filtrar('SEGA32X')" class="px-3 py-1 text-xs rounded-xl bg-indigo-600">SEGA32X</button>
<button onclick="filtrar('ATARI7800')" class="px-3 py-1 text-xs rounded-xl bg-purple-600">ATARI7800</button>
<button onclick="filtrar('JAGUAR')" class="px-3 py-1 text-xs rounded-xl bg-green-600">JAGUAR</button>

</div>

</div>

<div class="w-72">
<input type="text" id="search-input"
placeholder="Buscar juego..."
class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-4 py-2 text-sm"/>
</div>

</div>

</div>

</header>

<!-- MAIN -->
<main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 space-y-8">

<section id="emulator-section" class="hidden bg-black/70 border border-indigo-900 rounded-3xl overflow-hidden">

<div class="flex justify-between px-4 py-3 border-b border-indigo-900">

<h2 id="current-game-title" class="text-indigo-400 font-black">Cargando...</h2>

<div class="flex gap-2">
<button onclick="fullscreenGame()" class="bg-indigo-600 px-4 py-2 rounded-xl text-sm">Fullscreen</button>
<button onclick="cerrarJuego()" class="bg-red-600 px-4 py-2 rounded-xl text-sm">Salir</button>
</div>

</div>

<div class="emulator-container bg-black">
<iframe id="emulator-frame" class="w-full h-full border-0" allowfullscreen></iframe>
</div>

</section>

<div class="flex justify-between items-center">

<div>
<h3 class="text-3xl font-black">Colección Retro</h3>
<p class="text-gray-400">Seleccioná un juego</p>
</div>

<div class="bg-indigo-950 border border-indigo-800 px-4 py-2 rounded-2xl">
🎮 <span id="games-count">0</span> Juegos
</div>

</div>

<div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

<!-- ADS FOOTER -->
<div class="mt-10">
<script async="async" data-cfasync="false"
src="https://pl29470228.effectivecpmnetwork.com/a9/69/ee/a969eee3f6606fdd30bb1074b6e8e53f.js"></script>
</div>

</main>

<script>

function enterSite(){
    document.getElementById("welcome").style.display = "none";
}

const gamesGrid = document.getElementById('games-grid');
const emulatorSection = document.getElementById('emulator-section');
const emulatorFrame = document.getElementById('emulator-frame');
const currentGameTitle = document.getElementById('current-game-title');
const searchInput = document.getElementById('search-input');
const gamesCount = document.getElementById('games-count');
const loadingOverlay = document.getElementById('loading-overlay');

let listaJuegos = [];
let filtroActivo = "ALL";

function filtrar(tipo){
    filtroActivo = tipo;
    aplicar();
}

async function cargar(){
    const res = await fetch('./all_roms.json');
    listaJuegos = await res.json();
    gamesCount.textContent = listaJuegos.length;
    aplicar();
}

function aplicar(){
    let data = listaJuegos;

    if(filtroActivo !== "ALL"){
        data = data.filter(j => j.console === filtroActivo);
    }

    const texto = searchInput.value.toLowerCase();

    if(texto){
        data = data.filter(j => j.name.toLowerCase().includes(texto));
    }

    render(data);
}

function render(juegos){

    gamesGrid.innerHTML = "";

    juegos.forEach(j => {

        const card = document.createElement("div");

        card.className = "game-card bg-gray-900 border border-gray-800 rounded-3xl p-5";

        card.innerHTML = `
            <span class="text-xs bg-black px-2 py-1 rounded">${j.console}</span>
            <h3 class="mt-3 font-bold">${j.name}</h3>
            <button class="mt-4 w-full bg-indigo-600 py-2 rounded-xl">JUGAR</button>
        `;

        card.querySelector("button").onclick = () => {

            loadingOverlay.style.display = "flex";

            setTimeout(() => {

                currentGameTitle.textContent = j.name;
                emulatorSection.classList.remove("hidden");

                // SELECCIÓN DE CORE SIMPLIFICADA (EVITA EL ERROR DE ARCHIVO FALTANTE)
                let core = "sega32x";
                if(j.console === "ATARI7800") core = "atari7800";
                if(j.console === "JAGUAR") core = "jaguar";

                emulatorFrame.src =
                `./emulator.html?game=${encodeURIComponent(j.romUrl)}&core=${core}`;

                loadingOverlay.style.display = "none";
                window.scrollTo({top:0});

            }, 700);
        };

        gamesGrid.appendChild(card);
    });
}

searchInput.addEventListener("input", aplicar);

function cerrarJuego(){
    emulatorFrame.src = "";
    emulatorSection.classList.add("hidden");
}

function fullscreenGame(){
    emulatorFrame.requestFullscreen();
}

window.onload = cargar;

</script>

</body>
</html>
