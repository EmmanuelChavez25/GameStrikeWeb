<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>GAME-STRIKE RETRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
html{ scroll-behavior:smooth; }

body{
    background:#070b14;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 25%),
    radial-gradient(circle at bottom right,#581c87 0%,transparent 25%);
    opacity:.25;
    z-index:-1;
}

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-track{ background:#0b0f19; }
::-webkit-scrollbar-thumb{ background:#312e81; border-radius:10px; }

.game-card{ transition:.25s; }
.game-card:hover{
    transform:translateY(-5px) scale(1.02);
    border-color:#6366f1;
    box-shadow:0 0 20px rgba(99,102,241,.25);
}

.emulator-container{ height:75vh; }

#loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:99999;
}

.loader{
    width:80px;
    height:80px;
    border:6px solid #312e81;
    border-top:6px solid #8b5cf6;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:25px;
}

@keyframes spin{ to{ transform:rotate(360deg);} }

/* WELCOME */
#welcome{
    position:fixed;
    inset:0;
    background:black;
    z-index:100000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#welcome h1{
    font-size:34px;
    font-weight:900;
    background:linear-gradient(90deg,#6366f1,#a855f7);
    -webkit-background-clip:text;
    color:transparent;
}

#welcome p{ color:#aaa; margin-top:10px; }

#welcome button{
    margin-top:20px;
    padding:10px 20px;
    border-radius:12px;
    background:#6366f1;
    font-weight:bold;
}

.adbox{ margin-top:15px; }

#touch-controls{
    display:flex;
}
</style>
</head>

<body class="text-white font-sans min-h-screen flex flex-col">

<div id="welcome">

    <h1>BIENVENIDOS A GAME STRIKE</h1>
    <p>Retro Gaming Online - EmulatorJS Edition</p>

    <div class="adbox">
        <script async="async" data-cfasync="false"
        src="https://pl29470229.effectivecpmnetwork.com/e61a275bae57ec5c68e79426fe108696/invoke.js"></script>
        <div></div>
    </div>

    <div class="adbox">
        <script async="async" data-cfasync="false"
        src="https://pl29470228.effectivecpmnetwork.com/a9/69/ee/a969eee3f6606fdd30bb1074b6e8e53f.js"></script>
    </div>

    <button onclick="enterSite()">ENTRAR</button>
</div>

<div id="loading-overlay">
<div class="loader"></div>
<div>CARGANDO JUEGO...</div>
</div>

<header class="sticky top-0 z-50 backdrop-blur-lg bg-black/60 border-b border-indigo-900">

<div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">

<div>
<h1 class="text-2xl font-black text-indigo-400">GAME-STRIKE RETRO</h1>

<div class="flex gap-2 mt-2 flex-wrap">

<button onclick="filtrar('ALL')" class="px-3 py-1 text-xs bg-gray-800 rounded-xl">ALL</button>
<button onclick="filtrar('SEGA32X')" class="px-3 py-1 text-xs bg-indigo-600 rounded-xl">SEGA32X</button>
<button onclick="filtrar('ATARI7800')" class="px-3 py-1 text-xs bg-purple-600 rounded-xl">ATARI7800</button>
<button onclick="filtrar('JAGUAR')" class="px-3 py-1 text-xs bg-green-600 rounded-xl">JAGUAR</button>

<button onclick="filtrar('NES')" class="px-3 py-1 text-xs bg-red-600 rounded-xl">NES</button>

</div>
</div>

<div class="w-full md:w-72">
<input type="text" id="search-input" oninput="buscar(this.value)"
placeholder="Buscar juegos..."
class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white"/>
</div>

</div>

</header>

<main class="max-w-7xl mx-auto px-4 py-6">

<section id="emulator-section" class="hidden bg-black/70 rounded-3xl overflow-hidden border border-indigo-900">

<div class="flex justify-between p-3">
<h2 id="current-game-title" class="text-indigo-400 font-bold">Juego</h2>
<button onclick="cerrarJuego()" class="bg-red-600 px-3 py-1 rounded-xl">Salir</button>
</div>

<div class="emulator-container bg-black">
<iframe id="emulator-frame" class="w-full h-full"></iframe>
</div>

</section>

<h2 class="text-2xl font-bold mt-6">Colección Retro</h2>

<div id="games-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>

<div id="touch-controls" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 gap-2 z-[9999]">
<button onclick="pressKey('A')" class="bg-indigo-600 px-3 py-2 rounded-xl">A</button>
<button onclick="pressKey('B')" class="bg-purple-600 px-3 py-2 rounded-xl">B</button>
<button onclick="pressKey('START')" class="bg-green-600 px-3 py-2 rounded-xl">START</button>
<button onclick="pressKey('SELECT')" class="bg-gray-600 px-3 py-2 rounded-xl">SELECT</button>
</div>

</main>

<script>

function isMobile(){
    return window.innerWidth <= 768;
}

function enterSite(){
    document.getElementById("welcome").style.display = "none";
}

const gamesGrid = document.getElementById("games-grid");
const emulatorFrame = document.getElementById("emulator-frame");
const emulatorSection = document.getElementById("emulator-section");
const currentGameTitle = document.getElementById("current-game-title");

let lista = [];
let filtro = "ALL";
let busqueda = ""; // 🔥 VARIABLE DE BÚSQUEDA NUEVA

function filtrar(f){
    filtro = f;
    render();
}

// 🔥 FUNCIÓN NUEVA PARA CONTROLAR LA ENTRADA DEL BUSCADOR
function buscar(texto){
    busqueda = texto.toLowerCase();
    render();
}

async function cargar(){
    const res = await fetch("./all_roms.json");
    lista = await res.json();
    render();
}

function render(){

    gamesGrid.innerHTML = "";

    let data = lista;

    // Filtrar por consola seleccionada
    if(filtro !== "ALL"){
        data = data.filter(g => g.console === filtro);
    }

    // 🔥 FILTRAR ADEMÁS POR EL TEXTO DEL BUSCADOR
    if(busqueda !== ""){
        data = data.filter(g => g.name.toLowerCase().includes(busqueda));
    }

    data.forEach(g => {

        const div = document.createElement("div");
        div.className = "bg-gray-900 p-3 rounded-2xl border border-gray-800 game-card"; // Reincorporada la clase de transición

        div.innerHTML = `
            <div class="text-xs">${g.console}</div>
            <div class="font-bold">${g.name}</div>
            <button class="mt-2 w-full bg-indigo-600 rounded-xl py-1">JUGAR</button>
        `;

        div.querySelector("button").onclick = () => {

            emulatorSection.classList.remove("hidden");
            currentGameTitle.textContent = g.name;

            let core = "sega32x";

            if(g.console === "ATARI7800") core = "atari7800";
            if(g.console === "JAGUAR") core = "jaguar";

            // 🔥 AGREGADO NES
            if(g.console === "NES") core = "nes";

            emulatorFrame.src =
            `./emulator.html?game=${encodeURIComponent(g.romUrl)}&core=${core}`;

            autoFullscreen();
            showTouch();
        };

        gamesGrid.appendChild(div);
    });
}

function cerrarJuego(){
    emulatorFrame.src = "";
    emulatorSection.classList.add("hidden");
}

function pressKey(k){
    const f = document.getElementById("emulator-frame");
    f.contentWindow.postMessage({type:"key",key:k},"*");
}

function showTouch(){
    if(isMobile()){
        document.getElementById("touch-controls").classList.remove("hidden");
    }
}

function autoFullscreen(){
    if(isMobile()){
        const f = document.getElementById("emulator-frame");
        f.requestFullscreen?.();
    }
}

window.addEventListener("load", () => {
    cargar();

    if(isMobile()){
        document.querySelectorAll(".adbox").forEach(e => e.remove());
    }
});

</script>

</body>
</html>
