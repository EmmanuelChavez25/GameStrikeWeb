<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Strike Retro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans flex flex-col">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">
                GAME-STRIKE RETRO
            </span>
            <div class="w-64">
                <input type="text" id="search-input" placeholder="Buscar juego..." class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-2 text-sm focus:outline-none">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-8">

        <section id="emulator-section" class="hidden bg-gray-900 rounded-2xl border border-gray-800 p-4 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h2 id="current-game-title" class="text-lg font-bold text-indigo-400">Iniciando Consola Retro...</h2>
                <button onclick="cerrarJuego();" class="text-gray-400 hover:text-rose-500 bg-gray-800 px-3 py-1.5 rounded-lg text-xs font-bold">
                    ✕ CERRAR CONSOLA
                </button>
            </div>
            <div class="w-full h-[600px] bg-black rounded-xl overflow-hidden shadow-inner">
                <iframe id="emulator-frame" class="w-full h-full border-0" allowfullscreen="true" scrolling="no"></iframe>
            </div>
        </section>

        <div class="border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-extrabold text-white">Mi Colección Retro</h1>
            <p class="text-sm text-gray-400 mt-1">Hacé clic en Jugar Ahora para iniciar el emulador nativo en la pantalla.</p>
        </div>

        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    </main>

    <script>
        const gamesGrid = document.getElementById('games-grid');
        const emulatorSection = document.getElementById('emulator-section');
        const emulatorFrame = document.getElementById('emulator-frame');
        const currentGameTitle = document.getElementById('current-game-title');
        const searchInput = document.getElementById('search-input');
        let listaJuegos = [];

        async function cargarCatalogoCompleto() {
            try {
                const response = await fetch('all_roms.json');
                listaJuegos = await response.json();
                renderizarGrilla(listaJuegos);
            } catch (error) {
                gamesGrid.innerHTML = `<p class="text-center text-gray-400 col-span-full">Error al cargar la lista.</p>`;
            }
        }

        function renderizarGrilla(juegos) {
            gamesGrid.innerHTML = "";
            juegos.forEach(juego => {
                const tarjeta = document.createElement('div');
                tarjeta.className = "bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden p-4 flex flex-col justify-between space-y-4 shadow-lg";
                
                // Imagen por defecto si Imgur falla
                const imgSrc = "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400";
                
                tarjeta.innerHTML = `
                    <div>
                        <span class="text-[10px] bg-indigo-950 border border-indigo-800 text-indigo-400 px-2 py-0.5 rounded font-bold uppercase">${juego.console}</span>
                        <h3 class="text-white font-bold text-base mt-2">${juego.name}</h3>
                    </div>
                    <button onclick="iniciarJuegoReal('${juego.name.replace(/'/g, "\\'")}', '${juego.romUrl}', '${juego.console}')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-sm">
                        🎮 Jugar Ahora
                    </button>
                `;
                gamesGrid.appendChild(tarjeta);
            });
        }

        function iniciarJuegoReal(nombre, urlRom, consola) {
            currentGameTitle.textContent = `Jugando: ${nombre}`;
            emulatorSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            let core = "sega32x";
            if (consola === "MAME") core = "arcade";

            emulatorFrame.src = `emulator.html?rom=${encodeURIComponent(urlRom)}&core=${core}`;
        }

        function cerrarJuego() {
            emulatorSection.classList.add('hidden');
            emulatorFrame.src = "";
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderizarGrilla(listaJuegos.filter(j => j.name.toLowerCase().includes(term)));
        });

        window.addEventListener('DOMContentLoaded', cargarCatalogoCompleto);
    </script>
</body>
</html>
