<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>GAME-STRIKE RETRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

html{
    scroll-behavior:smooth;
}

body{
    background:#070b14;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 25%),
    radial-gradient(circle at bottom right,#581c87 0%,transparent 25%);
    opacity:.25;
    z-index:-1;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#0b0f19;
}

::-webkit-scrollbar-thumb{
    background:#312e81;
    border-radius:10px;
}

.game-card{
    transition:.25s;
    position:relative;
}

.game-card:hover{
    transform:translateY(-5px) scale(1.02);
    border-color:#6366f1;
    box-shadow:0 0 20px rgba(99,102,241,.25);
}

.emulator-container{
    height:75vh;
}

#loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:99999;
}

.loader{
    width:80px;
    height:80px;
    border:6px solid #312e81;
    border-top:6px solid #8b5cf6;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:25px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* WELCOME */

#welcome{
    position:fixed;
    inset:0;
    background:black;
    z-index:100000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#welcome h1{
    font-size:34px;
    font-weight:900;
    background:linear-gradient(90deg,#6366f1,#a855f7);
    -webkit-background-clip:text;
    color:transparent;
}

#welcome p{
    color:#aaa;
    margin-top:10px;
}

#welcome button{
    margin-top:20px;
    padding:10px 20px;
    border-radius:12px;
    background:#6366f1;
    font-weight:bold;
}

.adbox{
    margin-top:15px;
    min-height:50px;
}

</style>
</head>

<body class="text-white font-sans min-h-screen flex flex-col">

<!-- WELCOME -->

<div id="welcome">

    <h1>BIENVENIDOS A GAME STRIKE</h1>

    <p>Retro Gaming Online - EmulatorJS Edition</p>

    <div id="pc-ads-container"
    class="flex flex-col items-center gap-3 w-full"></div>

    <button onclick="enterSite()">ENTRAR</button>

</div>

<!-- MODAL ADS -->

<div id="ad-interstitial-modal"
class="fixed inset-0 bg-black/90 z-[100001] hidden flex items-center justify-center p-4">

    <div class="bg-gray-900 border border-indigo-500 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">

        <div class="w-12 h-12 border-4 border-indigo-500 border-t-purple-500 rounded-full mx-auto mb-4 animate-spin"></div>

        <h3 class="text-xl font-bold text-indigo-400 mb-2">
            Preparando Servidor de Juego
        </h3>

        <p class="text-xs text-gray-400 mb-6">
            Por favor, hacé clic abajo para continuar.
        </p>

        <button id="ad-continue-btn"
        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 py-3 rounded-2xl font-bold tracking-wide transition shadow-lg shadow-indigo-600/30">

            CONTINUAR

        </button>

    </div>

</div>

<!-- FLOATING AD -->

<div id="floating-ad-tab"
class="fixed bottom-4 right-4 z-[9998] flex items-center bg-gray-900/90 border border-indigo-900/60 backdrop-blur-sm rounded-xl pl-3 pr-1 py-1 shadow-xl">

    <span class="text-[10px] text-gray-400 font-medium mr-2 uppercase tracking-wider">
        Anuncio
    </span>

    <button onclick="triggerFloatingAd()"
    class="w-7 h-7 bg-indigo-950 text-indigo-400 hover:bg-indigo-900 hover:text-white rounded-lg flex items-center justify-center font-bold text-sm transition">

        ✕

    </button>

</div>

<!-- LOADING -->

<div id="loading-overlay">

    <div class="loader"></div>

    <div>CARGANDO JUEGO...</div>

</div>

<!-- HEADER -->

<header class="sticky top-0 z-50 backdrop-blur-lg bg-black/60 border-b border-indigo-900">

<div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3 relative">

    <div class="hidden md:block w-72"></div>

    <div class="flex flex-col items-center text-center flex-grow">

        <h1 class="text-2xl font-black text-indigo-400 tracking-wider">
            GAME-STRIKE RETRO
        </h1>

        <div class="flex gap-2 mt-2 flex-wrap justify-center">

            <button onclick="filtrar('ALL')"
            class="px-3 py-1 text-xs bg-gray-800 rounded-xl hover:bg-gray-700 transition">
                ALL
            </button>

            <button onclick="filtrar('SEGA32X')"
            class="px-3 py-1 text-xs bg-indigo-600 rounded-xl hover:bg-indigo-500 transition">
                SEGA32X
            </button>

            <button onclick="filtrar('ATARI7800')"
            class="px-3 py-1 text-xs bg-purple-600 rounded-xl hover:bg-purple-500 transition">
                ATARI7800
            </button>

            <button onclick="filtrar('JAGUAR')"
            class="px-3 py-1 text-xs bg-green-600 rounded-xl hover:bg-green-500 transition">
                JAGUAR
            </button>

            <button onclick="filtrar('NES')"
            class="px-3 py-1 text-xs bg-red-600 rounded-xl hover:bg-red-500 transition">
                NES
            </button>

            <button onclick="filtrar('N64')"
            class="px-3 py-1 text-xs bg-blue-600 rounded-xl hover:bg-blue-500 transition">
                N64
            </button>

            <button onclick="filtrar('FAVORITOS')"
            class="px-3 py-1 text-xs bg-yellow-600 text-white font-bold rounded-xl hover:bg-yellow-500 transition">
                ⭐ FAVORITOS
            </button>

        </div>

    </div>

    <div class="w-full md:w-72">

        <input type="text"
        id="search-input"
        oninput="buscar(this.value)"
        placeholder="Buscar juegos..."
        class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white"/>

    </div>

</div>

</header>

<!-- MAIN -->

<main class="max-w-7xl mx-auto px-4 py-6 flex-grow">

<!-- EMULADOR -->

<section id="emulator-section"
class="hidden bg-black/70 rounded-3xl overflow-hidden border border-indigo-900">

<div class="flex justify-between items-center p-3">

    <h2 id="current-game-title"
    class="text-indigo-400 font-bold">

        Juego

    </h2>

    <div class="flex gap-2">

        <button onclick="agrandarPantalla()"
        class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded-xl text-xs font-bold transition">

            Pantalla Completa

        </button>

        <button onclick="cerrarJuego()"
        class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded-xl text-xs font-bold transition">

            Salir

        </button>

    </div>

</div>

<div class="emulator-container bg-black">

    <iframe id="emulator-frame"
    class="w-full h-full"
    allow="fullscreen; keyboard"
    allowfullscreen></iframe>

</div>

</section>

<!-- TITULO -->

<h2 id="section-title"
class="text-2xl font-bold mt-6">

    Colección Retro

</h2>

<!-- GRID -->

<div id="games-grid"
class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>

<!-- ADS -->

<div id="global-bottom-ads"
class="mt-12 w-full flex flex-col items-center justify-center p-4 border border-dashed border-indigo-900/40 rounded-2xl bg-gray-950/40 min-h-[120px]">

    <span class="text-[10px] text-gray-500 mb-3 block uppercase tracking-widest font-bold">
        Anuncio
    </span>

    <div id="native-banner-container"
    class="w-full flex justify-center"></div>

</div>

</main>

<script>

const SMARTLINK_URL =
"https://www.effectivecpmnetwork.com/vs496jw3?key=b7e43b566e8614c045f8eb6a7a936831";

function isMobile(){
    return window.innerWidth <= 768;
}

function enterSite(){
    document.getElementById("welcome").style.display = "none";
}

const gamesGrid =
document.getElementById("games-grid");

const emulatorFrame =
document.getElementById("emulator-frame");

const emulatorSection =
document.getElementById("emulator-section");

const currentGameTitle =
document.getElementById("current-game-title");

let lista = [];

let favoritos =
JSON.parse(localStorage.getItem("gs_favoritos")) || [];

let filtro = "ALL";

let busqueda = "";

function filtrar(f){

    filtro = f;

    if(filtro === "FAVORITOS"){

        document.getElementById("section-title")
        .textContent = "Mis Juegos Guardados";

    } else {

        document.getElementById("section-title")
        .textContent = "Colección Retro";
    }

    render();
}

function buscar(texto){

    busqueda = texto.toLowerCase();

    render();
}

async function cargar(){

    const res =
    await fetch("./all_roms.json");

    lista = await res.json();

    render();
}

function toggleFavorito(idJuego, btnElement){

    const index = favoritos.indexOf(idJuego);

    if(index === -1){

        favorites.push(idJuego);

        btnElement.textContent = "⭐";

        btnElement.classList.remove("text-gray-600");
        btnElement.classList.add("text-yellow-400");

    } else {

        favoritos.splice(index,1);

        btnElement.textContent = "☆";

        btnElement.classList.remove("text-yellow-400");
        btnElement.classList.add("text-gray-600");
    }

    localStorage.setItem(
        "gs_favoritos",
        JSON.stringify(favoritos)
    );

    if(filtro === "FAVORITOS"){
        render();
    }
}

function obtenerCartuchoHTML(g){

    return `
    <div class="w-28 h-32 bg-gray-800 rounded-2xl border border-gray-700 p-2 flex flex-col items-center justify-center mb-3 shadow-lg">

        <div class="text-[9px] uppercase text-indigo-400 font-bold mb-2">
            ${g.console}
        </div>

        <div class="text-[10px] font-black uppercase text-center text-white leading-tight">
            ${g.name}
        </div>

    </div>
    `;
}

function crearTarjetaJuego(g){

    const div = document.createElement("div");

    div.className =
    "bg-gray-900 p-4 rounded-3xl border border-gray-800 game-card flex flex-col items-center justify-between";

    const esFav =
    favoritos.includes(g.romUrl);

    const cartucho =
    obtenerCartuchoHTML(g);

    div.innerHTML = `

        <button class="absolute top-3 right-3 z-10 text-base focus:outline-none transition fav-star-btn ${esFav ? 'text-yellow-400' : 'text-gray-600'}">

            ${esFav ? '⭐' : '☆'}

        </button>

        ${cartucho}

        <div class="w-full text-center mt-1">

            <span class="text-[10px] uppercase font-bold text-gray-500 block tracking-wider">
                ${g.console}
            </span>

            <div class="font-bold text-sm text-gray-200 mt-0.5 line-clamp-1 capitalize">
                ${g.name}
            </div>

            <button class="mt-3 w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 font-bold rounded-xl py-1.5 text-xs tracking-wide transition shadow-md play-game-btn">

                JUGAR

            </button>

        </div>
    `;

    div.querySelector(".fav-star-btn").onclick = (e) => {

        e.stopPropagation();

        toggleFavorito(g.romUrl,e.target);
    };

    div.querySelector(".play-game-btn").onclick = () => {
        iniciarProcesoJuego(g);
    };

    return div;
}

function iniciarProcesoJuego(g){

    const modal =
    document.getElementById("ad-interstitial-modal");

    const continueBtn =
    document.getElementById("ad-continue-btn");

    modal.classList.remove("hidden");

    continueBtn.onclick = () => {

        window.open(SMARTLINK_URL,"_blank");

        modal.classList.add("hidden");

        emulatorSection.classList.remove("hidden");

        // Hace que la pantalla suba de forma suave hacia la zona del emulador
        emulatorSection.scrollIntoView({ behavior: 'smooth' });

        currentGameTitle.textContent = g.name;

        let core = "sega32x";

        if(g.console === "ATARI7800") core = "atari7800";
        if(g.console === "JAGUAR") core = "jaguar";
        if(g.console === "NES") core = "nes";
        if(g.console === "N64") core = "n64";

        emulatorFrame.src =
        `./emulator.html?game=${encodeURIComponent(g.romUrl)}&core=${core}`;
    };
}

function render(){

    gamesGrid.innerHTML = "";

    let data = lista;

    if(filtro === "FAVORITOS"){

        data = data.filter(g =>
        favoritos.includes(g.romUrl));

    } else if(filtro !== "ALL"){

        data = data.filter(g =>
        g.console === filtro);
    }

    if(busqueda !== ""){

        data = data.filter(g =>
        g.name.toLowerCase().includes(busqueda));
    }

    if(data.length === 0){

        gamesGrid.innerHTML = `
        <div class="col-span-4 text-center py-8 text-gray-500 text-sm">
            No se encontraron juegos.
        </div>
        `;

        return;
    }

    data.forEach(g => {

        const div =
        crearTarjetaJuego(g);

        gamesGrid.appendChild(div);
    });
}

function triggerFloatingAd(){

    window.open(SMARTLINK_URL,"_blank");

    const tab =
    document.getElementById("floating-ad-tab");

    if(tab) tab.remove();
}

function cerrarJuego(){

    emulatorFrame.src = "";

    emulatorSection.classList.add("hidden");
}

function agrandarPantalla(){

    const f =
    document.getElementById("emulator-frame");

    if(f.requestFullscreen){
        f.requestFullscreen();
    }
}

function inicializarPublicidad(){

    const pcContainer =
    document.getElementById("pc-ads-container");

    const nativeContainer =
    document.getElementById("native-banner-container");

    if(!isMobile()){

        pcContainer.innerHTML = `
            <div class="adbox">
                <script async="async"
                data-cfasync="false"
                src="https://pl29470229.effectivecpmnetwork.com/e61a275bae57ec5c68e79426fe108696/invoke.js"><\/script>
            </div>
        `;
    }

    nativeContainer.innerHTML = `
        <script async="async"
        data-cfasync="false"
        src="https://pl29470228.effectivecpmnetwork.com/a9/69/ee/a969eee3f6606fdd30bb1074b6e8e53f.js"><\/script>
    `;
}

window.addEventListener("load", () => {

    cargar();

    inicializarPublicidad();
});

</script>

</body>
</html>
